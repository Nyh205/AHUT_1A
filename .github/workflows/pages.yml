# 把 cs61a_offline 目录部署为 GitHub Pages 站点
# 在线浏览: https://nyh205.github.io/AHUT_1A/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cs61a_offline
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
